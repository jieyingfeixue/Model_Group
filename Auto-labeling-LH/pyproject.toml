[project]
name = "auto-labeling"
version = "0.1.0"
description = "Multi-sensor semi-automatic 3D annotation tool (Web edition)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "anthropic>=0.30",
    "openai>=1.30",
    "httpx>=0.27",
    "paramiko>=3.4",
    "open3d>=0.18",
    "scikit-learn>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=1.10",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.40",
    "groundingdino-py>=0.4",
    "segment-anything-2",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
auto-labeling-web = "web_server.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
