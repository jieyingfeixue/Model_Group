<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LH 标注平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#0f0f1a 0%,#11111b 50%,#181825 100%);color:#cdd6f4;height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{text-align:center;max-width:600px;padding:40px}
h1{font-size:42px;font-weight:800;margin-bottom:8px;background:linear-gradient(135deg,#89b4fa,#a6e3a1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#6c7086;font-size:14px;margin-bottom:48px}
.cards{display:flex;gap:16px;justify-content:center}
.card{flex:1;max-width:260px;padding:28px 20px;border-radius:12px;background:#181825;border:1px solid #313244;cursor:pointer;text-decoration:none;transition:all .2s}
.card:hover{border-color:#89b4fa;transform:translateY(-2px)}
.card .icon{font-size:40px;margin-bottom:12px}
.card h2{font-size:18px;color:#cdd6f4;margin-bottom:6px}
.card p{font-size:12px;color:#6c7086;line-height:1.5}
.footer{margin-top:48px;font-size:11px;color:#45475a}
</style>
</head>
<body>
<div class="wrap">
  <h1>LH 多传感器标注平台</h1>
  <p class="sub">可见光双目 + 红外 + LiDAR 点云 | K-Radar 数据集</p>
  <div class="cards">
    <a class="card" href="/browser">
      <div class="icon">📷</div>
      <h2>数据浏览</h2>
      <p>按目录结构浏览可见光、红外、LiDAR 点云数据</p>
    </a>
    <a class="card" href="/annotate">
      <div class="icon">🏷️</div>
      <h2>数据标注</h2>
      <p>红外匹配 + SAM3 建筑检测 + CSV 记录 + 框选标注</p>
    </a>
  </div>
  <p class="footer">Server: LH Dataset · 2,500,000+ 图片 · 10 日期</p>
</div>
</body>
</html>
