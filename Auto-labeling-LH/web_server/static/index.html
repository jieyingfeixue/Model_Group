<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LH 数据浏览</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0f0f1a;color:#cdd6f4;height:100vh;display:flex}
#sb{width:300px;min-width:240px;background:#11111b;display:flex;flex-direction:column;border-right:1px solid #313244;overflow:hidden;transition:width .2s ease,min-width .2s ease,border-color .2s ease}
#sb.collapsed{width:0;min-width:0;border-right-color:transparent}
#sb .h{padding:10px 12px;background:#181825;border-bottom:1px solid #313244}
#sb .h h1{font-size:14px;color:#cdd6f4}#sb .h a{font-size:10px;color:#89b4fa;text-decoration:none}
#tree{flex:1;overflow-y:auto;padding:2px 0}
.tt{cursor:pointer;user-select:none;white-space:nowrap;display:flex;align-items:center}
.tt:hover{background:#1e1e2e}
.tt .ar{width:12px;font-size:9px;color:#6c7086;flex-shrink:0;transition:transform .15s}
.tt .ar.op{transform:rotate(90deg)}
.tt .ic{width:16px;text-align:center;flex-shrink:0}
.tt .lb{flex:1;overflow:hidden;text-overflow:ellipsis}
.tt .cn{font-size:9px;color:#585b70;margin-left:4px;flex-shrink:0}
.tt.date{color:#f5c2e7;font-weight:700;font-size:12px;padding:2px 10px}
.tt.capture{color:#b4befe;font-size:11px;padding:2px 20px}
.tt.part{color:#94e2d5;font-size:11px;padding:2px 30px}
.tt.segment{color:#a6adc8;font-size:11px;padding:2px 40px}
.tt.cam{color:#89b4fa;font-size:11px;padding:2px 50px}
.tt.cam.sel{background:#1e1e2e;color:#a6e3a1;font-weight:700}
.ch{display:none}.ch.op{display:block}

#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tb{padding:5px 10px;background:#181825;border-bottom:1px solid #313244;font-size:11px;color:#a6adc8;flex-shrink:0;display:flex;align-items:center;gap:10px}
#tb b{color:#cdd6f4}
#tb a{color:#89b4fa;text-decoration:none;font-weight:600}
#tb .sb-toggle{padding:3px 8px;border-radius:3px;cursor:pointer;background:#313244;border:1px solid #45475a;color:#cdd6f4;font-size:10px;white-space:nowrap}
#tb .sb-toggle:hover{background:#45475a}
#tb .tb-content{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#grid{flex:1;overflow-y:auto;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:5px;align-content:start}
.card{background:#181825;border:2px solid #313244;border-radius:5px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#89b4fa}
.card img{width:100%;height:110px;object-fit:cover;display:block;background:#0a0a14}
.card .info{padding:4px 6px;font-size:10px}
.card .info .idx{color:#cdd6f4;font-weight:600}
.card .info .ts{color:#6c7086;font-size:9px}

#viewer{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.95);z-index:1000;flex-direction:column;align-items:center;justify-content:center}
#viewer.on{display:flex}
#viewer .close{position:absolute;top:12px;right:20px;font-size:30px;color:#cdd6f4;cursor:pointer;z-index:1001}
#viewer .nav{display:flex;gap:10px;align-items:center;margin-bottom:8px}
#viewer .nav button{padding:6px 14px;border-radius:4px;cursor:pointer;background:#313244;border:1px solid #45475a;color:#cdd6f4;font-size:13px}
#viewer .nav span{color:#a6adc8;font-size:12px;min-width:80px;text-align:center}
#viewer img{max-width:95vw;max-height:85vh;border-radius:4px;object-fit:contain}
#viewer .meta{margin-top:6px;font-size:11px;color:#6c7086}

.sp{display:flex;align-items:center;justify-content:center;height:100%;color:#6c7086;font-size:13px}
.em{display:flex;align-items:center;justify-content:center;height:100%;color:#6c7086;font-size:13px;flex-direction:column}</style>
</head>
<body>

<aside id="sb">
  <div class="h"><h1>📷 LH 数据集</h1><a href="/">← 首页</a></div>
  <div id="tree"><div class="sp">加载目录树...</div></div>
</aside>

<main id="main">
  <div id="tb"><button class="sb-toggle" id="sbToggle" type="button" title="收起目录侧边栏" aria-controls="sb" aria-expanded="true" onclick="toggleSidebar()">☰ 目录</button><span class="tb-content" id="tbContent">展开左侧目录树，点击相机节点查看图片</span></div>
  <div id="grid"><div class="em">← 选择相机目录</div></div>
</main>

<div id="viewer"><span class="close" onclick="closeView()">&times;</span>
  <div class="nav"><button onclick="nav(-1)">◀</button><span id="vi"></span><button onclick="nav(1)">▶</button></div>
  <img id="vimg" src=""><div class="meta" id="vm"></div>
</div>

<script>
var R='/data1/LHO/nas/LH_Dataset/LH_data_all_sensor';
var CAMS={'037':{d:'hikrobot_camera__DA8679037__image_raw',l:'037 可见光(左)',i:'📷'},'038':{d:'hikrobot_camera__DA8679038__image_raw',l:'038 可见光(右)',i:'📸'},'IR':{d:'usb_ir__image_raw',l:'IR 红外',i:'🔴'}};
var curSeg='',curCam='',curCamDir='',imgs=[],imgIdx=-1;
/*TREE_DATA_PLACEHOLDER*/

function api(u){return fetch(u).then(function(r){if(!r.ok)throw Error(r.status);return r.json();});}

function toggleSidebar(){
  var sb=document.getElementById('sb'),btn=document.getElementById('sbToggle');
  var collapsed=sb.classList.toggle('collapsed');
  btn.setAttribute('aria-expanded',String(!collapsed));
  btn.title=collapsed?'展开目录侧边栏':'收起目录侧边栏';
}

function renderTree(data){
  var h='';
  for(var di=0;di<data.length;di++){var dn=data[di];
    h+='<div class="tt date" onclick="tg(this)"><span class="ar">▶</span><span class="ic">📅</span><span class="lb">'+esc(dn.n)+'</span><span class="cn">'+dn.c+'</span></div><div class="ch">';
    for(var ci=0;ci<(dn.k||[]).length;ci++){var cn=dn.k[ci];
      h+='<div class="tt capture" onclick="tg(this)"><span class="ar">▶</span><span class="ic">📂</span><span class="lb">'+sh(cn.n,28)+'</span><span class="cn">'+cn.c+'</span></div><div class="ch">';
      for(var pi=0;pi<(cn.k||[]).length;pi++){var pn=cn.k[pi];
        h+='<div class="tt part" onclick="tg(this)"><span class="ar">▶</span><span class="ic">📁</span><span class="lb">'+sh(pn.n,20)+'</span><span class="cn">'+pn.c+'</span></div><div class="ch">';
        for(var si=0;si<(pn.k||[]).length;si++){var sn=pn.k[si];var sp=dn.n+'/'+cn.n+'/'+pn.n+'/'+sn.n;
          h+='<div class="tt segment" onclick="tg(this)"><span class="ar">▶</span><span class="ic">📄</span><span class="lb">'+sn.n+'</span><span class="cn">'+(sn.c==null?'':sn.c)+'</span></div><div class="ch">';
          for(var camI=0;camI<(sn.k||[]).length;camI++){var cam=sn.k[camI];var ci2=CAMS[cam.n]||{i:'🖼',l:cam.n};
            h+='<div class="tt cam" onclick="event.stopPropagation();selCam(\''+esc(sp)+'\',\''+cam.n+'\')"><span class="ic">'+ci2.i+'</span><span class="lb">'+ci2.l+'</span><span class="cn">'+(cam.c==null?'':cam.c+'张')+'</span></div>';}
          h+='</div>';}h+='</div>';}h+='</div>';}h+='</div>';}
  document.getElementById('tree').innerHTML=h;
}
function tg(el){el.querySelector('.ar').classList.toggle('op');var n=el.nextElementSibling;if(n)n.classList.toggle('op');}

function selCam(sp,ck){
  document.querySelectorAll('.tt.cam').forEach(function(e){e.classList.remove('sel');});
  curSeg=sp;curCam=ck;curCamDir=(CAMS[ck]||{}).d||'';imgIdx=-1;
  var el=event.target;while(el&&!el.classList.contains('tt'))el=el.parentElement;
  if(el)el.classList.add('sel');
  // expand parents
  var p=el.parentElement;
  while(p&&p.id!=='sb'){if(p.classList.contains('ch'))p.classList.add('op');var pr=p.previousElementSibling;if(pr){var a=pr.querySelector('.ar');if(a)a.classList.add('op');}p=p.parentElement;}
  loadImgs();
}
function loadImgs(){
  document.getElementById('grid').innerHTML='<div class="sp">加载中...</div>';
  document.getElementById('tbContent').innerHTML='加载中...';
  api('/api/browse/images?root='+encodeURIComponent(R)+'&path='+encodeURIComponent(curSeg)+'/'+curCam)
    .then(function(d){imgs=d.images||[];imgIdx=0;renderGrid();
      document.getElementById('tbContent').innerHTML='<a href=\"/\">← 首页</a> <b>'+curCam+'</b> '+curSeg.split('/').pop()+' · <b>'+imgs.length+'</b> 张 | <a href=\"/annotate?seg='+encodeURIComponent(curSeg)+'\">标注此段 →</a>';})
    .catch(function(e){document.getElementById('grid').innerHTML='<div class="em">加载失败</div>';});
}
function renderGrid(){
  var h='';for(var i=0;i<imgs.length;i++){
    var fn=imgs[i],ip=curSeg+'/images/'+curCamDir+'/'+fn;
    h+='<div class="card" onclick="viewImg('+i+')"><img src="/api/browse/image?root='+encodeURIComponent(R)+'&path='+encodeURIComponent(ip)+'&thumb=1" loading="lazy"><div class="info"><span class="idx">#'+(i+1)+'</span> <span class="ts">t='+fmtTs(fn)+'</span></div></div>';
  }
  document.getElementById('grid').innerHTML=h;
}

function viewImg(idx){imgIdx=idx;showViewer();document.getElementById('viewer').classList.add('on');document.addEventListener('keydown',onKey);}
function closeView(){document.getElementById('viewer').classList.remove('on');document.removeEventListener('keydown',onKey);}
function showViewer(){
  var fn=imgs[imgIdx],ip=curSeg+'/images/'+curCamDir+'/'+fn;
  document.getElementById('vimg').src='/api/browse/image?root='+encodeURIComponent(R)+'&path='+encodeURIComponent(ip);
  document.getElementById('vi').textContent=(imgIdx+1)+'/'+imgs.length;
  document.getElementById('vm').textContent=fn+' | ts='+fmtTs(fn);
}
function nav(d){if(!imgs.length)return;imgIdx=(imgIdx+d+imgs.length)%imgs.length;showViewer();}
function onKey(e){if(e.key==='ArrowLeft')nav(-1);if(e.key==='ArrowRight')nav(1);if(e.key==='Escape')closeView();}
document.getElementById('viewer').addEventListener('click',function(e){if(e.target===this)closeView();});

function fmtTs(fn){var m=/_t(\d+\.\d+)/.exec(fn);return m?parseFloat(m[1]).toFixed(3):'?';}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function sh(s,m){return s.length>m?s.substring(0,m-3)+'...':s;}

if(typeof TREE_DATA!=='undefined'&&TREE_DATA)renderTree(TREE_DATA);
else api('/api/browse/tree?root='+encodeURIComponent(R)).then(function(d){renderTree(d.tree);});
</script>
</body>
</html>
