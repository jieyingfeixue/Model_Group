<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Test</title>
<style>body{background:#111;color:#fff;font:16px sans-serif;padding:20px}</style>
</head><body>
<h1>连接测试 OK</h1>
<p id="t"></p>
<p id="api"></p>
<script>
document.getElementById('t').textContent='JS执行 OK - '+new Date().toISOString();
fetch('/api/browse/tree?root='+encodeURIComponent('/data1/LHO/nas/LH_Dataset/LH_data_all_sensor'))

</script>
